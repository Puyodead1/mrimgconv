[package]
name = "mrimgconv"
version = "0.2.0"
edition = "2021"
description = "Convert Macrium Reflect .mrimg disk images to dynamic VHD or sparse raw disk images"
license = "MIT"
authors = ["Puyodead1"]
repository = "https://github.com/Puyodead1/mrimgconv"
readme = "README.md"
keywords = ["macrium", "mrimg", "vhd", "raw-image", "disk-image"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/re", "/.github"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
