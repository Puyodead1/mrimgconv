[package]
name = "mrimg2vhd"
version = "0.1.0"
edition = "2021"
description = "Convert Macrium Reflect .mrimg disk images to dynamic (sparse) VHD files"
license = "MIT"
authors = ["Puyodead1"]
repository = "https://github.com/Puyodead1/mrimg2vhd"
readme = "README.md"
keywords = ["macrium", "mrimg", "vhd", "backup", "disk-image"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/re", "/.github"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
